<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Work Order System</title>
    
    <!-- Link to Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <h1>✈️ Aircraft Work Order Tracking</h1>
    </header>

    <!-- Main Content Container -->
    <main class="container">
        <!-- Container for dynamic alerts -->
        <div id="alertContainer"></div>

        <!-- Action Button -->
        <button class="btn btn-primary" onclick="loadFromSheet()" id="refreshBtn">🔄 Refresh from Sheet</button>

        <!-- Work Orders Table -->
        <table id="workOrderTable">
            <thead>
                <tr>
                    <th style="width: 80px;">Status</th>
                    <th style="width: 100px;">Aircraft</th>
                    <th style="width: 140px;">W/O Number</th>
                    <th style="width: 300px;">Description</th>
                    <th style="width: 180px;">Due Date / AFH / AFL</th>
                    <th style="width: 150px;">Remarks</th>
                    <th style="width: 200px;">Action Plan</th>
                    <th style="width: 120px;">Completed By</th>
                    <th style="width: 100px;">Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Initial loading state -->
                <tr>
                    <td colspan="9" class="loading">Loading work orders...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <!-- Modal for Completing a Work Order -->
    <div id="completeModal" class="modal">
        <div class="modal-content">
            <h2>Complete Work Order</h2>
            
            <div id="woDetails" class="work-order-details"></div>
            
            <form id="completeForm" onsubmit="completeWorkOrder(event)">
                <input type="hidden" id="completeIndex">
                
                <label for="technicianName">Your Name *</label>
                <input type="text" id="technicianName" required placeholder="Enter your full name">
                
                <label for="logbookFile">Logbook PDF *</label>
                <input type="file" id="logbookFile" accept=".pdf" required>
                <small>Max file size: 50MB</small>
                
                <label for="completionNotes">Notes (Optional)</label>
                <textarea id="completionNotes" rows="3" placeholder="Add any completion notes..."></textarea>
                
                <div class="modal-actions">
                    <button type="submit" class="btn btn-success" id="submitBtn">✓ Mark Complete</button>
                    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="script.js" defer></script>

</body>
</html>
