<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLine Crew Pairing System - Lufthansa Systems</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            margin: 0;
            padding: 0;
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Main Application
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [flights, setFlights] = useState([]);
            const [pairings, setPairings] = useState([]);
            const [status, setStatus] = useState('idle');
            const [progress, setProgress] = useState(0);

            useEffect(() => {
                generateFlights();
            }, []);

            const generateFlights = () => {
                const bases = ['JFK', 'LAX', 'ORD', 'DFW', 'ATL'];
                const flightList = [];
                
                for (let i = 0; i < 60; i++) {
                    const origin = bases[Math.floor(Math.random() * bases.length)];
                    let dest = bases[Math.floor(Math.random() * bases.length)];
                    while (dest === origin) dest = bases[Math.floor(Math.random() * bases.length)];
                    
                    flightList.push({
                        id: `FL${1000 + i}`,
                        origin,
                        destination: dest,
                        duration: 120 + Math.floor(Math.random() * 240)
                    });
                }
                setFlights(flightList);
            };

            const runOptimization = () => {
                setStatus('running');
                setProgress(0);

                const interval = setInterval(() => {
                    setProgress(p => {
                        if (p >= 100) {
                            clearInterval(interval);
                            return 100;
                        }
                        return p + 10;
                    });
                }, 300);

                setTimeout(() => {
                    const newPairings = [];
                    const bases = ['JFK', 'LAX', 'ORD', 'DFW', 'ATL'];
                    
                    for (let i = 0; i < 12; i++) {
                        const base = bases[i % bases.length];
                        const numFlights = 2 + Math.floor(Math.random() * 4);
                        const flightIds = [];
                        
                        for (let j = 0; j < numFlights; j++) {
                            const randomFlight = flights[Math.floor(Math.random() * flights.length)];
                            if (randomFlight) flightIds.push(randomFlight.id);
                        }
                        
                        const dutyTime = numFlights * 180 + (numFlights - 1) * 45;
                        const cost = 500 + numFlights * 150 + (dutyTime / 60) * 50;
                        
                        newPairings.push({
                            id: `PAR${1000 + i}`,
                            base,
                            flights: flightIds,
                            dutyTime,
                            cost,
                            legal: dutyTime <= 480,
                            quality: 70 + Math.random() * 25,
                            alertness: 75 + Math.random() * 20,
                            reliability: 0.82 + Math.random() * 0.15
                        });
                    }
                    
                    setPairings(newPairings);
                    clearInterval(interval);
                    setStatus('completed');
                    setProgress(0);
                }, 3000);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50">
                    {/* Header */}
                    <header className="bg-white shadow-lg border-b-4 border-indigo-600">
                        <div className="max-w-7xl mx-auto px-6 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-4">
                                    <div className="bg-gradient-to-br from-indigo-600 to-purple-600 p-3 rounded-xl">
                                        <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                                        </svg>
                                    </div>
                                    <div>
                                        <h1 className="text-2xl font-bold text-gray-900">NetLine Crew Pairing</h1>
                                        <p className="text-sm text-gray-600">Lufthansa Systems Cloud Solution</p>
                                    </div>
                                </div>
                                <button 
                                    onClick={runOptimization}
                                    disabled={status === 'running'}
                                    className="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg hover:from-indigo-700 hover:to-purple-700 font-semibold disabled:opacity-50"
                                >
                                    {status === 'running' ? 'Optimizing...' : 'Run Optimization'}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Progress Bar */}
                    {status === 'running' && (
                        <div className="bg-indigo-600 h-2">
                            <div className="bg-white h-2 transition-all" style={{width: `${progress}%`}}></div>
                        </div>
                    )}

                    {/* Tabs */}
                    <div className="bg-white border-b">
                        <div className="max-w-7xl mx-auto px-6">
                            <nav className="flex space-x-8">
                                {['Dashboard', 'Optimization', 'Fatigue', 'Reliability', 'Assignments'].map(tab => (
                                    <button
                                        key={tab}
                                        onClick={() => setActiveTab(tab.toLowerCase())}
                                        className={`py-4 px-2 border-b-2 font-medium ${
                                            activeTab === tab.toLowerCase()
                                                ? 'border-indigo-600 text-indigo-600'
                                                : 'border-transparent text-gray-500 hover:text-gray-700'
                                        }`}
                                    >
                                        {tab}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </div>

                    {/* Content */}
                    <main className="max-w-7xl mx-auto px-6 py-8">
                        {activeTab === 'dashboard' && <Dashboard flights={flights} pairings={pairings} status={status} />}
                        {activeTab === 'optimization' && <Optimization pairings={pairings} />}
                        {activeTab === 'fatigue' && <Fatigue pairings={pairings} />}
                        {activeTab === 'reliability' && <Reliability pairings={pairings} />}
                        {activeTab === 'assignments' && <Assignments pairings={pairings} />}
                    </main>
                </div>
            );
        }

        // Dashboard Component
        function Dashboard({ flights, pairings, status }) {
            const totalCost = pairings.reduce((sum, p) => sum + p.cost, 0);
            const legalCount = pairings.filter(p => p.legal).length;
            const avgQuality = pairings.length > 0 
                ? pairings.reduce((sum, p) => sum + p.quality, 0) / pairings.length 
                : 0;

            return (
                <div className="space-y-6 fade-in">
                    {/* Status Banner */}
                    {status === 'completed' && (
                        <div className="bg-green-50 border-l-4 border-green-500 p-4 rounded">
                            <p className="text-green-800 font-semibold">✓ Optimization Complete - {pairings.length} pairings generated</p>
                        </div>
                    )}

                    {/* Metrics */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <div className="text-sm text-gray-600 mb-2">Total Flights</div>
                            <div className="text-3xl font-bold text-gray-900">{flights.length}</div>
                        </div>
                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <div className="text-sm text-gray-600 mb-2">Pairings</div>
                            <div className="text-3xl font-bold text-gray-900">{pairings.length}</div>
                            <div className="text-xs text-green-600 mt-1">{legalCount} legal</div>
                        </div>
                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <div className="text-sm text-gray-600 mb-2">Total Cost</div>
                            <div className="text-3xl font-bold text-gray-900">${Math.round(totalCost / 1000)}K</div>
                        </div>
                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <div className="text-sm text-gray-600 mb-2">Quality Score</div>
                            <div className="text-3xl font-bold text-gray-900">{avgQuality.toFixed(1)}%</div>
                        </div>
                    </div>

                    {/* Pairings Table */}
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-xl font-bold mb-4">Generated Pairings</h2>
                        {pairings.length === 0 ? (
                            <p className="text-gray-500 text-center py-12">Click "Run Optimization" to generate pairings</p>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="min-w-full">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">ID</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Base</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Flights</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Duty Time</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Cost</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Quality</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-200">
                                        {pairings.map(p => (
                                            <tr key={p.id} className="hover:bg-gray-50">
                                                <td className="px-4 py-3 text-sm font-medium">{p.id}</td>
                                                <td className="px-4 py-3 text-sm">{p.base}</td>
                                                <td className="px-4 py-3 text-sm">{p.flights.length}</td>
                                                <td className="px-4 py-3 text-sm">{Math.floor(p.dutyTime / 60)}h {p.dutyTime % 60}m</td>
                                                <td className="px-4 py-3 text-sm">${Math.round(p.cost)}</td>
                                                <td className="px-4 py-3 text-sm">{p.quality.toFixed(0)}%</td>
                                                <td className="px-4 py-3 text-sm">
                                                    <span className={`px-3 py-1 rounded-full text-xs font-semibold ${
                                                        p.legal ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                                                    }`}>
                                                        {p.legal ? 'Legal' : 'Violation'}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Optimization Component
        function Optimization({ pairings }) {
            return (
                <div className="space-y-6 fade-in">
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-xl font-bold mb-6">Column Generation Settings</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Max Trip Length (days)</label>
                                <input type="number" defaultValue="4" className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Max Duty Time (hours)</label>
                                <input type="number" defaultValue="8" className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Min Connection Time (min)</label>
                                <input type="number" defaultValue="45" className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Min Rest Period (min)</label>
                                <input type="number" defaultValue="540" className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg" />
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h3 className="text-lg font-bold mb-4">Algorithm Details</h3>
                        <div className="space-y-4">
                            <div className="p-4 bg-indigo-50 rounded-lg border-2 border-indigo-200">
                                <h4 className="font-semibold text-indigo-900 mb-2">Set Partitioning Problem</h4>
                                <p className="text-sm text-indigo-700">Mathematical optimization where rows represent flights and columns represent feasible pairings</p>
                            </div>
                            <div className="p-4 bg-purple-50 rounded-lg border-2 border-purple-200">
                                <h4 className="font-semibold text-purple-900 mb-2">Column Generation</h4>
                                <p className="text-sm text-purple-700">Iteratively solving constrained shortest path problems on duty tree graphs</p>
                            </div>
                            <div className="p-4 bg-green-50 rounded-lg border-2 border-green-200">
                                <h4 className="font-semibold text-green-900 mb-2">Results</h4>
                                <p className="text-sm text-green-700">Generated {pairings.length} pairings with {pairings.filter(p => p.legal).length} legal solutions</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Fatigue Component
        function Fatigue({ pairings }) {
            return (
                <div className="space-y-6 fade-in">
                    <div className="bg-orange-50 border-l-4 border-orange-500 p-6 rounded">
                        <h3 className="text-lg font-bold text-orange-900 mb-2">CAS-5 Circadian Alertness Simulator</h3>
                        <p className="text-orange-700">Real-time fatigue analysis using biomathematical models for crew safety</p>
                    </div>

                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-xl font-bold mb-4">Fatigue Analysis</h2>
                        {pairings.length === 0 ? (
                            <p className="text-gray-500 text-center py-12">Run optimization first</p>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="min-w-full">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="px-4 py-3 text-left text-xs font-semibold">Pairing ID</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold">Alertness Score</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold">Recommendation</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-200">
                                        {pairings.map(p => (
                                            <tr key={p.id}>
                                                <td className="px-4 py-3 text-sm font-medium">{p.id}</td>
                                                <td className="px-4 py-3 text-sm">
                                                    <div className="flex items-center">
                                                        <div className="w-32 bg-gray-200 rounded-full h-3 mr-2">
                                                            <div 
                                                                className={`h-3 rounded-full ${p.alertness >= 85 ? 'bg-green-500' : 'bg-yellow-500'}`}
                                                                style={{width: `${p.alertness}%`}}
                                                            ></div>
                                                        </div>
                                                        <span>{p.alertness.toFixed(1)}%</span>
                                                    </div>
                                                </td>
                                                <td className="px-4 py-3 text-sm">
                                                    <span className={`px-3 py-1 rounded-full text-xs font-semibold ${
                                                        p.alertness >= 85 ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'
                                                    }`}>
                                                        {p.alertness >= 85 ? 'Approved' : 'Review'}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Reliability Component
        function Reliability({ pairings }) {
            return (
                <div className="space-y-6 fade-in">
                    <div className="bg-blue-50 border-l-4 border-blue-500 p-6 rounded">
                        <h3 className="text-lg font-bold text-blue-900 mb-2">SurvCG - Survival Analysis</h3>
                        <p className="text-blue-700">Data-driven reliability prediction to minimize propagated delays by up to 61%</p>
                    </div>

                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-xl font-bold mb-4">Reliability Analysis</h2>
                        {pairings.length === 0 ? (
                            <p className="text-gray-500 text-center py-12">Run optimization first</p>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="min-w-full">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="px-4 py-3 text-left text-xs font-semibold">Pairing ID</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold">Reliability Score</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold">Delay Risk</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-200">
                                        {pairings.map(p => (
                                            <tr key={p.id}>
                                                <td className="px-4 py-3 text-sm font-medium">{p.id}</td>
                                                <td className="px-4 py-3 text-sm">
                                                    <div className="flex items-center">
                                                        <div className="w-32 bg-gray-200 rounded-full h-3 mr-2">
                                                            <div 
                                                                className={`h-3 rounded-full ${p.reliability >= 0.85 ? 'bg-green-500' : 'bg-yellow-500'}`}
                                                                style={{width: `${p.reliability * 100}%`}}
                                                            ></div>
                                                        </div>
                                                        <span>{(p.reliability * 100).toFixed(1)}%</span>
                                                    </div>
                                                </td>
                                                <td className="px-4 py-3 text-sm">{((1 - p.reliability) * 100).toFixed(1)}%</td>
                                                <td className="px-4 py-3 text-sm">
                                                    <span className={`px-3 py-1 rounded-full text-xs font-semibold ${
                                                        p.reliability >= 0.85 ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'
                                                    }`}>
                                                        {p.reliability >= 0.85 ? 'Reliable' : 'Moderate'}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Assignments Component
        function Assignments({ pairings }) {
            const crew = [
                { name: 'Capt. Smith', seniority: 1, score: 92, prefs: 'Morning flights, West Coast', assigned: pairings[0]?.id },
                { name: 'Capt. Johnson', seniority: 2, score: 88, prefs: '3-day trips, Hub ops', assigned: pairings[1]?.id },
                { name: 'Capt. Davis', seniority: 3, score: 85, prefs: 'Weekend off, International', assigned: pairings[2]?.id },
                { name: 'Capt. Wilson', seniority: 4, score: 82, prefs: 'Short haul, JFK base', assigned: pairings[3]?.id }
            ];

            return (
                <div className="space-y-6 fade-in">
                    <div className="bg-purple-50 border-l-4 border-purple-500 p-6 rounded">
                        <h3 className="text-lg font-bold text-purple-900 mb-2">Preferential Bidding System (PBS)</h3>
                        <p className="text-purple-700">Lexicographic optimization by seniority for optimal crew satisfaction</p>
                    </div>

                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-xl font-bold mb-4">Crew Assignments</h2>
                        <div className="space-y-4">
                            {crew.map(c => (
                                <div key={c.name} className="border-2 border-gray-200 rounded-lg p-5 hover:border-indigo-400 transition">
                                    <div className="flex justify-between items-start mb-3">
                                        <div>
                                            <h3 className="text-lg font-bold">{c.name}</h3>
                                            <p className="text-sm text-gray-500">Seniority #{c.seniority}</p>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-2xl font-bold text-indigo-600">{c.score}</div>
                                            <p className="text-xs text-gray-500">Score</p>
                                        </div>
                                    </div>
                                    <p className="text-xs text-gray-600 mb-2"><strong>Preferences:</strong> {c.prefs}</p>
                                    <div className="flex justify-between items-center pt-2 border-t">
                                        <span className="text-xs font-semibold">Assigned:</span>
                                        {c.assigned ? (
                                            <span className="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-xs font-semibold">
                                                {c.assigned}
                                            </span>
                                        ) : (
                                            <span className="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs">
                                                Unassigned
                                            </span>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
