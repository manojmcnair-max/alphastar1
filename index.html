<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aircraft Work Order System</title>

  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      /* Higher contrast palette */
      --bg1:#f7f9fc;
      --bg2:#eef3f9;

      --text:#0f172a;
      --muted:#475569;
      --card:#ffffff;
      --border:#d7e0ea;

      --primary:#0a4d8c;
      --primary2:#063a6a;
      --accent:#ff6b35;

      --success:#0ea371;
      --warning:#b45309;
      --danger:#b42318;

      --shadow: 0 10px 28px rgba(15, 23, 42, .10);
      --shadow2: 0 4px 12px rgba(15, 23, 42, .10);

      --radius: 14px;
      --radius2: 10px;

      --focus: 0 0 0 4px rgba(255, 107, 53, .25);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin:0;
      font-family: "Rajdhani", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
    }

    /* Header */
    .header{
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
      color: #fff;
      padding: 1.2rem 1.25rem;
      box-shadow: var(--shadow2);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header h1{
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.7rem);
      letter-spacing: .2px;
      display:flex;
      align-items:center;
      gap:.5rem;
    }

    .container{
      max-width: 1600px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    /* Toolbar */
    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .toolbar .hint{
      color: var(--muted);
      font-size: .95rem;
      line-height: 1.2;
    }

    /* Buttons */
    .btn{
      appearance:none;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: .7rem 1.05rem;
      cursor:pointer;
      font-weight: 700;
      letter-spacing: .2px;
      transition: transform .05s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
      user-select:none;
      font-size: 1rem;
      line-height: 1;
      display:inline-flex;
      align-items:center;
      gap:.5rem;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .btn-primary{
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(255,107,53,.25);
    }
    .btn-primary:hover{ filter: brightness(.98); }

    .btn-success{
      background: var(--success);
      color:#fff;
      box-shadow: 0 8px 18px rgba(14,163,113,.18);
    }

    .btn-ghost{
      background: #fff;
      border-color: var(--border);
      color: var(--text);
    }
    .btn-ghost:hover{ background: #f8fafc; }

    .btn:focus-visible{
      outline: none;
      box-shadow: var(--focus);
    }

    /* Alerts */
    #alertContainer{ margin-bottom: 1rem; }
    .alert{
      padding: .9rem 1rem;
      border-radius: 12px;
      border: 1px solid;
      margin-bottom: .75rem;
      box-shadow: 0 6px 14px rgba(15,23,42,.06);
      font-size: 1rem;
      line-height: 1.25;
    }
    .alert-success{ background:#e9f9f2; border-color:#b6efd5; color:#0b5f41; }
    .alert-error{ background:#fdecec; border-color:#facdcd; color:#7a1d1d; }

    /* Table wrapper for responsiveness */
    .table-wrap{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-scroll{
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table{
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1150px; /* allows horizontal scroll on small screens */
      background: white;
    }

    thead th{
      position: sticky;
      top: 64px; /* header height approx; sticky within scroll */
      z-index: 10;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
      color: #fff;
      padding: .85rem .85rem;
      text-align: left;
      font-size: .95rem;
      letter-spacing: .2px;
      border-bottom: 1px solid rgba(255,255,255,.15);
      white-space: nowrap;
    }

    tbody td{
      padding: .85rem .85rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      font-size: 1rem;
      line-height: 1.25;
      color: var(--text);
    }

    tbody tr:nth-child(even){ background: #f8fbff; }
    tbody tr:hover{ background: #eef6ff; }

    .loading{
      text-align:center;
      padding: 2rem;
      color: var(--muted);
      font-size: 1rem;
    }

    /* Status pill */
    .status-pill{
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      padding: .25rem .55rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: .85rem;
      letter-spacing: .2px;
      border: 1px solid;
      white-space: nowrap;
    }
    .status-pill::before{
      content:"";
      width: .55rem;
      height: .55rem;
      border-radius: 999px;
      background: currentColor;
      opacity: .9;
    }
    .status-pending{
      color: #92400e;
      background: #fff7ed;
      border-color: #fed7aa;
    }
    .status-completed{
      color: #065f46;
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    /* Due / Action formatting */
    .mono{
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: .92rem;
      color: #0b1220;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    .due-badge{
      display:inline-block;
      padding: .18rem .45rem;
      border-radius: 6px;
      font-size: .72rem;
      font-weight: 900;
      margin-right: .4rem;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: #fff;
    }
    .badge-afh{ background: #2563eb; }
    .badge-afl{ background: #7c3aed; }

    .remaining-critical{ color: var(--danger); font-weight: 900; }
    .remaining-warning{ color: var(--warning); font-weight: 900; }

    /* Small text in table cells */
    .small{ font-size: .92rem; color: var(--muted); }
    .nowrap{ white-space: nowrap; }

    /* Modal */
    .modal{
      display:none;
      position:fixed;
      inset:0;
      background: rgba(2, 6, 23, .65);
      z-index: 1000;
      padding: 1rem;
    }
    .modal.active{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .modal-content{
      background: #fff;
      border-radius: 16px;
      width: min(760px, 100%);
      max-height: 92vh;
      overflow:auto;
      padding: 1.25rem;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.3);
    }
    .modal-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 1rem;
      margin-bottom: .75rem;
    }
    .modal-header h2{
      margin: 0;
      font-size: 1.35rem;
    }

    label{
      display:block;
      margin-top: .85rem;
      font-weight: 800;
      color: #0b1220;
    }
    input, select, textarea{
      width:100%;
      padding: .8rem .85rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: .4rem;
      font-size: 1rem;
      background: #fff;
    }
    input:focus, textarea:focus, select:focus{
      outline:none;
      box-shadow: var(--focus);
      border-color: rgba(255,107,53,.55);
    }

    .panel{
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .9rem;
      margin-top: .75rem;
      color: #0b1220;
    }

    .modal-actions{
      display:flex;
      gap: .75rem;
      justify-content:flex-end;
      flex-wrap: wrap;
      margin-top: 1.1rem;
    }

    a.btn-link{
      text-decoration:none;
    }

    @media (max-width: 640px){
      .toolbar .hint{ font-size: .92rem; }
      .btn{ width: 100%; justify-content:center; }
      .modal-actions .btn{ width: 100%; }
      thead th{ top: 62px; }
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>✈ Aircraft Work Order Tracking</h1>
  </div>

  <div class="container">
    <div id="alertContainer"></div>

    <div class="toolbar">
      <button class="btn btn-primary" onclick="loadFromSheet()" id="refreshBtn">Refresh from Sheet</button>
      <div class="hint">
        Tip: On smaller screens, scroll horizontally to view all columns.
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-scroll" role="region" aria-label="Work order table">
        <table id="workOrderTable">
          <thead>
            <tr>
              <th style="width:110px;">Status</th>
              <th style="width:110px;">Aircraft</th>
              <th style="width:160px;">W/O Number</th>
              <th style="min-width:360px;">Description</th>
              <th style="min-width:220px;">Due Date / AFH / AFL</th>
              <th style="min-width:220px;">Remarks</th>
              <th style="min-width:240px;">Action Plan</th>
              <th style="width:160px;">Completed By</th>
              <th style="width:140px;">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="9" class="loading">Loading work orders...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="completeModal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="completeTitle">
      <div class="modal-header">
        <h2 id="completeTitle">Complete Work Order</h2>
        <button type="button" class="btn btn-ghost" onclick="closeModal()" aria-label="Close modal">Close</button>
      </div>

      <div id="woDetails" class="panel"></div>

      <form id="completeForm" onsubmit="completeWorkOrder(event)">
        <input type="hidden" id="completeIndex" />

        <label for="technicianName">Your Name *</label>
        <input type="text" id="technicianName" required placeholder="Enter your full name" autocomplete="name" />

        <label for="logbookFile">Logbook PDF *</label>
        <input type="file" id="logbookFile" accept=".pdf" required />
        <div class="small" style="margin-top:.35rem;">Max file size: 50MB</div>

        <label for="completionNotes">Notes (Optional)</label>
        <textarea id="completionNotes" rows="3" placeholder="Add any completion notes..."></textarea>

        <div class="modal-actions">
          <button type="submit" class="btn btn-success" id="submitBtn">Mark Complete</button>
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Re-paste your URLs carefully (PDF copy/paste sometimes injects control characters).
    const SHEET_URL = 'PASTE_YOUR_PUBLISHED_CSV_URL_HERE';
    const APPS_SCRIPT_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

    let workOrders = [];

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function loadFromSheet() {
      const refreshBtn = document.getElementById('refreshBtn');
      refreshBtn.disabled = true;
      refreshBtn.textContent = 'Loading...';

      try {
        const response = await fetch(SHEET_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const csv = await response.text();
        workOrders = parseCSV(csv);
        renderTable();
        showAlert('Data loaded successfully! Found ' + workOrders.length + ' work orders.', 'success');
      } catch (error) {
        console.error('Error loading sheet:', error);
        showAlert('Failed to load data: ' + error.message, 'error');
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = 'Refresh from Sheet';
      }
    }

    function parseCSV(csv) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let insideQuotes = false;

      for (let i = 0; i < csv.length; i++) {
        const char = csv[i];
        const nextChar = csv[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentField += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentField);
          currentField = '';
        } else if (char === '\n' && !insideQuotes) {
          currentRow.push(currentField);
          if (currentRow.length > 0 && currentRow[0]) rows.push(currentRow);
          currentRow = [];
          currentField = '';
        } else {
          currentField += char;
        }
      }

      if (currentField || currentRow.length > 0) {
        currentRow.push(currentField);
        if (currentRow.length > 0 && currentRow[0]) rows.push(currentRow);
      }

      const orders = [];
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (row.length < 4) continue;

        orders.push({
          aircraft: (row[0] || '').trim(),
          woNumber: (row[1] || '').trim(),
          description: (row[2] || '').trim(),
          dueDate: (row[3] || '').trim(),
          remarks: (row[4] || '').trim(),
          actionPlan: (row[5] || '').trim(),
          status: (row[6] || 'Pending').trim(),
          completedBy: (row[7] || '').trim(),
          completedDate: (row[8] || '').trim(),
          logbookUrl: (row[9] || '').trim(),
          completionNotes: (row[10] || '').trim()
        });
      }
      return orders;
    }

    function formatDueDate(dueDate) {
      if (!dueDate) return '<span class="small">-</span>';

      const raw = escapeHtml(dueDate);
      let html = '<div class="mono">';

      const afhMatch = dueDate.match(/(\d+):(\d+)\s*(?:AFH)?/i);
      if (afhMatch) {
        html += `<div><span class="due-badge badge-afh">AFH</span>${escapeHtml(afhMatch[1])}:${escapeHtml(afhMatch[2])} hrs</div>`;
      }

      const aflMatch = dueDate.match(/(\d+)\s*\(?\s*(AFL|AFC)\s*\)?/i);
      if (aflMatch) {
        html += `<div><span class="due-badge badge-afl">AFL</span>${escapeHtml(aflMatch[1])} cycles</div>`;
      }

      const dateMatch = dueDate.match(/(\d{4}-\d{2}-\d{2})|(\d{1,2}-[A-Za-z]{3}-\d{2,4})/);
      if (dateMatch && !afhMatch && !aflMatch) {
        html += `<div>${escapeHtml(dateMatch[0])}</div>`;
      }

      if (!afhMatch && !aflMatch && !dateMatch) html += raw;

      html += '</div>';
      return html;
    }

    function formatActionPlan(actionPlan) {
      if (!actionPlan || actionPlan.trim().toUpperCase() === 'NIL') return '<span class="small">-</span>';

      const raw = escapeHtml(actionPlan);
      let html = '<div class="mono">';

      const afhRemMatch = actionPlan.match(/(\d+)\s+AFH\s+REMAINING/i);
      if (afhRemMatch) {
        const hours = parseInt(afhRemMatch[1], 10);
        const className = hours <= 10 ? 'remaining-critical' : hours <= 30 ? 'remaining-warning' : '';
        html += `<div class="${className}">${hours} AFH rem.</div>`;
      }

      const aflRemMatch = actionPlan.match(/(\d+)\s+AF[CL]\s+REMAINING/i);
      if (aflRemMatch) {
        const cycles = parseInt(aflRemMatch[1], 10);
        const className = cycles <= 5 ? 'remaining-critical' : cycles <= 15 ? 'remaining-warning' : '';
        html += `<div class="${className}">${cycles} AFL rem.</div>`;
      }

      const asOfMatch = actionPlan.match(/AS\s+OF\s+(\d{1,2}-[A-Za-z]{3}-\d{2,4})/i);
      if (asOfMatch) {
        html += `<div class="small" style="font-style: italic;">as of ${escapeHtml(asOfMatch[1])}</div>`;
      }

      if (!afhRemMatch && !aflRemMatch) html += raw;

      html += '</div>';
      return html;
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');

      if (workOrders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="loading">No work orders found</td></tr>';
        return;
      }

      tbody.innerHTML = workOrders.map((wo, i) => {
        const statusLower = (wo.status || 'Pending').toLowerCase();
        const statusClass = statusLower === 'completed' ? 'status-completed' : 'status-pending';

        const completedBlock = `
          <div class="small">
            <div>${escapeHtml(wo.completedBy || '-')}</div>
            ${wo.completedDate ? `<div class="nowrap">${escapeHtml(wo.completedDate)}</div>` : ''}
          </div>
        `;

        const actionBtn = (wo.status !== 'Completed')
          ? `<button class="btn btn-success" onclick="openModal(${i})" style="padding:.55rem .75rem; font-size:.95rem;">Complete</button>`
          : (wo.logbookUrl
              ? `<a href="${escapeHtml(wo.logbookUrl)}" target="_blank" rel="noopener" class="btn btn-primary btn-link" style="padding:.55rem .75rem; font-size:.95rem;">PDF</a>`
              : `<span class="small">Done</span>`);

        return `
          <tr>
            <td><span class="status-pill ${statusClass}">${escapeHtml(wo.status)}</span></td>
            <td><strong>${escapeHtml(wo.aircraft)}</strong></td>
            <td class="small">${escapeHtml(wo.woNumber)}</td>
            <td>${escapeHtml(wo.description)}</td>
            <td>${formatDueDate(wo.dueDate)}</td>
            <td>${wo.remarks ? escapeHtml(wo.remarks) : '<span class="small">-</span>'}</td>
            <td>${formatActionPlan(wo.actionPlan)}</td>
            <td>${completedBlock}</td>
            <td>${actionBtn}</td>
          </tr>
        `;
      }).join('');
    }

    function openModal(i) {
      const wo = workOrders[i];
      document.getElementById('completeIndex').value = i;

      document.getElementById('woDetails').innerHTML = `
        <div><strong>Aircraft:</strong> ${escapeHtml(wo.aircraft)}</div>
        <div><strong>W/O Number:</strong> ${escapeHtml(wo.woNumber)}</div>
        <div><strong>Description:</strong> ${escapeHtml(wo.description)}</div>
        <div><strong>Due:</strong> ${escapeHtml(wo.dueDate || '-')}</div>
        ${wo.actionPlan && wo.actionPlan.trim().toUpperCase() !== 'NIL'
          ? `<div style="margin-top:.35rem;"><strong>Action Plan:</strong> ${escapeHtml(wo.actionPlan)}</div>`
          : ''
        }
      `;

      const modal = document.getElementById('completeModal');
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      document.getElementById('technicianName').focus();
    }

    function closeModal() {
      const modal = document.getElementById('completeModal');
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      document.getElementById('completeForm').reset();
    }

    // Close on backdrop click
    document.getElementById('completeModal').addEventListener('click', (e) => {
      if (e.target.id === 'completeModal') closeModal();
    });

    // Close on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('completeModal');
        if (modal.classList.contains('active')) closeModal();
      }
    });

    async function completeWorkOrder(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading...';

      const i = document.getElementById('completeIndex').value;
      const wo = workOrders[i];
      const name = document.getElementById('technicianName').value.trim();
      const file = document.getElementById('logbookFile').files[0];
      const notes = document.getElementById('completionNotes').value.trim();

      if (!file) {
        showAlert('Please choose a PDF file.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Mark Complete';
        return;
      }

      if (file.size > 50 * 1024 * 1024) {
        showAlert('File too large! Maximum size is 50MB.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Mark Complete';
        return;
      }

      try {
        const base64 = await fileToBase64(file);

        const data = {
          aircraft: wo.aircraft,
          woNumber: wo.woNumber,
          status: 'Completed',
          completedBy: name,
          completedDate: new Date().toISOString().split('T')[0],
          logbookBase64: base64,
          completionNotes: notes
        };

        submitBtn.textContent = 'Saving...';

        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
          closeModal();
          showAlert(`Work Order ${wo.woNumber} completed successfully!`, 'success');
          // quick reload
          setTimeout(() => loadFromSheet(), 800);
        } else {
          throw new Error(result.error || 'Failed to complete work order');
        }

      } catch (error) {
        console.error('Error:', error);
        showAlert('Error: ' + error.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Mark Complete';
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function showAlert(message, type) {
      const container = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      container.appendChild(alert);

      setTimeout(() => {
        alert.style.opacity = '0';
        alert.style.transition = 'opacity 0.35s';
        setTimeout(() => alert.remove(), 400);
      }, 4500);
    }

    loadFromSheet();
  </script>
</body>
</html>
